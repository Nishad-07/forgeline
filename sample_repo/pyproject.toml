[project]
name = "paylite"
version = "1.0.0"
description = "PayLite: a small payments service (sample target repository for Forgeline agents)"
requires-python = ">=3.11"
dependencies = ["fastapi", "pydantic", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.coverage.run]
source = ["app"]
