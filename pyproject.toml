[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeline"
version = "0.1.0"
description = "A multi-agent software delivery pipeline (LangGraph) with tests, security checks and human approval gates"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nishad-07" }]
keywords = ["multi-agent", "langgraph", "llm", "agents", "software-engineering", "human-in-the-loop"]
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.24",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langchain-core==1.8.4",
  "langchain-google-genai==4.5.2",
  "langchain-ollama==1.1.0",
  "pydantic==2.14.4",
  "typer==0.29.2",
  "rich==15.0.0",
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "sse-starlette==3.7.0",
  "tenacity==9.1.4",
  "PyYAML==6.0.4",
  "python-dotenv==1.2.4",
  "httpx==0.28.1",
  # tools the QA / Security agents run inside the sandbox
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.6",
  "bandit==1.9.4",
]

[project.urls]
Homepage = "https://github.com/Nishad-07/forgeline"
Demo = "https://nishad-07.github.io/forgeline/"

[project.optional-dependencies]
dev = ["pytest-xdist==3.8.0"]

[project.scripts]
forgeline = "forgeline.cli:app"

[tool.setuptools.packages.find]
include = ["forgeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["sample_repo", "workspace", "dashboard", "baseline"]

[tool.ruff.lint.per-file-ignores]
"forgeline/cli.py" = ["B008"]  # typer.Option/Argument in defaults is Typer's documented pattern
